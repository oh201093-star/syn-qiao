<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080607" />
  <title>Syn Qiao</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

    :root { --red: #d3172d; --deep-red: #5d0611; --ink: #080607; --bone: #ece6dc; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--ink); color: var(--bone); font-family: Cinzel, Georgia, serif; overflow-x: hidden; }
    button, a { font: inherit; }

    .grain, .vignette, .weapons { position: fixed; inset: 0; pointer-events: none; }
    .grain { opacity: .25; z-index: 4; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.36'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }
    .vignette { z-index: 3; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.68) 100%); }
    .weapons { z-index: 0; overflow: hidden; }
    .weapons svg { width: 100%; height: 100%; }
    .weapon { fill: #19060a; stroke: #7d0b19; stroke-width: 1.2; opacity: .76; filter: drop-shadow(0 0 7px rgba(184, 13, 35, .27)); }
    .weapon.dark { fill: #0d0607; stroke: #460810; opacity: .93; }
    .weapon.accent { fill: #26070c; stroke: #bf1127; opacity: .68; }
    .mist { fill: url(#mist); opacity: .82; }

    main { position: relative; z-index: 2; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(22px, 5vw, 80px) 30px; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid rgba(211, 23, 45, .32); padding-bottom: 18px; }
    .brand { font-size: clamp(.72rem, 1.1vw, .94rem); letter-spacing: .34em; color: #fff4e7; text-decoration: none; white-space: nowrap; }
    .brand i { display: inline-block; color: var(--red); font-style: normal; padding-right: .5em; transform: scale(1.4); }
    .nav-links { display: flex; align-items: center; gap: clamp(15px, 3vw, 43px); }
    .nav-links a { color: #a69a93; font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .16em; text-decoration: none; text-transform: uppercase; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--red); }

    .hero { align-self: center; max-width: 900px; padding: 9vh 0 7vh; }
    .eyebrow { display: flex; align-items: center; gap: 13px; color: #d42738; font-family: 'DM Mono', monospace; font-size: .64rem; letter-spacing: .24em; text-transform: uppercase; }
    .eyebrow::before { content: ''; display: block; width: 42px; height: 1px; background: var(--red); box-shadow: 0 0 8px var(--red); }
    h1 { position: relative; margin: 19px 0 18px; font-size: clamp(3.7rem, 10.8vw, 9.5rem); line-height: .81; letter-spacing: -.045em; font-weight: 700; text-transform: uppercase; text-shadow: 0 2px 0 #000, 0 0 40px rgba(153, 8, 24, .28); }
    h1 span { display: block; color: transparent; -webkit-text-stroke: 1px rgba(239, 225, 211, .8); }
    h1::after { content: ''; position: absolute; width: min(50vw, 420px); height: 3px; left: 4px; bottom: -24px; background: linear-gradient(90deg, var(--red), transparent); box-shadow: 0 0 12px var(--red); }
    .intro { max-width: 410px; margin: 48px 0 31px; color: #bcb1a8; font-family: 'DM Mono', monospace; font-size: clamp(.75rem, 1.2vw, .9rem); line-height: 1.85; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 13px; }
    .enter { position: relative; display: inline-flex; align-items: center; gap: 18px; padding: 16px 23px; border: 1px solid rgba(226, 36, 55, .8); color: #fff3eb; background: rgba(80, 4, 13, .22); cursor: pointer; text-decoration: none; font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; overflow: hidden; transition: color .25s, transform .25s, box-shadow .25s; }
    .enter::before { content: ''; position: absolute; inset: 0; background: var(--red); transform: translateX(-101%); transition: transform .3s ease; z-index: -1; }
    .enter:hover { transform: translateY(-3px); box-shadow: 0 0 27px rgba(216, 20, 42, .42); }
    .enter:hover::before { transform: translateX(0); }
    .enter b { color: var(--red); font-size: 1.1rem; font-weight: 400; transition: color .25s; }
    .enter:hover b { color: #fff; }
    .enter.game-link { border-color: rgba(236, 230, 220, .36); background: rgba(8, 6, 7, .62); }
    .enter.game-link::before { background: #750b19; }

    .footer { display: flex; justify-content: space-between; align-items: end; gap: 18px; border-top: 1px solid rgba(211, 23, 45, .25); padding-top: 17px; font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .14em; color: #756864; text-transform: uppercase; }
    .seal { display: flex; align-items: center; gap: 8px; color: #b31a2a; }
    .seal::before { content: '✦'; font-size: 1rem; }
    .status { color: #c8bdb3; }
    .status em { color: var(--red); font-style: normal; }
    body.entered .weapons { animation: tremor .4s both; }
    body.entered h1 { animation: blaze .6s both; }
    @keyframes tremor { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes blaze { 50% { text-shadow: 0 0 45px #e10c2c, 0 0 80px #a4071a; } }

    @media (max-width: 620px) {
      main { padding: 21px 21px 24px; }
      .nav-links a:not(.active) { display: none; }
      h1 { font-size: clamp(3.3rem, 18vw, 5.8rem); }
      .hero { padding: 12vh 0 9vh; }
      .footer { font-size: .49rem; }
      .weapon { opacity: .54; }
    }
  </style>
</head>
<body>
  <div class="weapons" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mist" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5e0813" stop-opacity=".45"/><stop offset="1" stop-color="#080607" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse class="mist" cx="850" cy="460" rx="650" ry="440" />
      <!-- crossed blades -->
      <g class="weapon" transform="translate(1060,-120) rotate(37)">
        <path d="M-14 4 L-8 -315 L0 -375 L8 -315 L14 4 L7 17 L-7 17 Z"/>
        <path d="M-46 18 L46 18 L35 33 L15 29 L15 155 L-15 155 L-15 29 L-35 33 Z"/>
        <path d="M-15 155 L15 155 L25 256 L0 282 L-25 256 Z"/>
      </g>
      <g class="weapon dark" transform="translate(1250,130) rotate(-29)">
        <path d="M-16 0 L-8 -285 L0 -360 L8 -285 L16 0 L8 14 L-8 14 Z"/>
        <path d="M-52 15 L52 15 L42 31 L19 27 L19 142 L-19 142 L-19 27 L-42 31 Z"/>
        <path d="M-19 142 L19 142 L29 268 L0 293 L-29 268 Z"/>
      </g>
      <!-- tall spear at left -->
      <g class="weapon dark" transform="translate(108,80) rotate(13)">
        <path d="M-10 85 L0 -35 L10 85 L0 128 Z"/>
        <rect x="-4" y="125" width="8" height="690" rx="3"/>
        <path d="M-27 164 L0 137 L27 164 L17 173 L0 158 L-17 173 Z"/>
      </g>
      <!-- large axe -->
      <g class="weapon accent" transform="translate(310,635) rotate(-50)">
        <rect x="-9" y="-280" width="18" height="550" rx="6"/>
        <path d="M-10 -215 C-143 -260 -177 -168 -165 -81 C-150 26 -57 68 -10 38 Z"/>
        <path d="M10 -215 C143 -260 177 -168 165 -81 C150 26 57 68 10 38 Z"/>
        <path d="M-9 270 L9 270 L15 304 L0 321 L-15 304 Z"/>
      </g>
      <!-- dagger bottom right -->
      <g class="weapon" transform="translate(1110,800) rotate(55)">
        <path d="M-13 6 L0 -260 L13 6 L7 19 L-7 19 Z"/>
        <path d="M-64 22 L64 22 L49 40 L17 34 L17 139 L-17 139 L-17 34 L-49 40 Z"/>
        <path d="M-17 139 L17 139 L26 198 L0 231 L-26 198 Z"/>
      </g>
    </svg>
  </div>
  <div class="vignette"></div><div class="grain"></div>
  <main>
    <nav>
      <a href="index.html" class="brand"><i>✦</i>SYN QIAO</a>
      <div class="nav-links">
        <a class="active" href="index.html">Home</a>
        <a href="oath.html">The Oath</a>
        <a href="sanctum.html">Sanctum</a>
      </div>
    </nav>

    <section class="hero" id="top">
      <div class="eyebrow">Keepers of the last flame</div>
      <h1>Syn<span>Qiao</span></h1>
      <p class="intro">Beyond the dying embers, steel waits in silence. Step through the threshold and let the night remember your name.</p>
      <div class="hero-actions">
        <a class="enter" href="oath.html" id="enter"><span>Enter the vault</span><b>→</b></a>
        <a class="enter game-link" href="https://emberfall-knights-oath.vercel.app" target="_blank" rel="noopener noreferrer"><span>Play Emberfall</span><b>↗</b></a>
      </div>
    </section>

    <footer class="footer">
      <span class="seal">The iron covenant</span>
      <span class="status"><em>●</em> Emberwatch / 13.07</span>
    </footer>
  </main>
  <script>
    const enter = document.querySelector('#enter');
    enter.addEventListener('click', () => {
      document.body.classList.remove('entered');
      void document.body.offsetWidth;
      document.body.classList.add('entered');
    });

    document.addEventListener('pointermove', (event) => {
      const x = (event.clientX / window.innerWidth - .5) * 10;
      const y = (event.clientY / window.innerHeight - .5) * 10;
      document.querySelector('.weapons').style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
